
name: Kalxa RSS Jobs Import

on:
  workflow_dispatch:

  schedule:
    # Every 6 hours at minute 17.
    - cron: "17 */6 * * *"
      timezone: "Africa/Johannesburg"

jobs:
  import-rss-jobs:
    name: Import RSS Jobs
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Wake Kalxa and import RSS jobs
        env:
          KALXA_RSS_IMPORT_TOKEN: ${{ secrets.KALXA_RSS_IMPORT_TOKEN }}
          KALXA_BASE_URL: ${{ vars.KALXA_BASE_URL }}

        run: |
          set -euo pipefail

          BASE_URL="${KALXA_BASE_URL:-https://lac-local-access.onrender.com}"
          BASE_URL="${BASE_URL%/}"

          echo "========================================"
          echo "KALXA RSS JOBS IMPORT"
          echo "========================================"
          echo "Base URL: ${BASE_URL}"
          echo ""

          # ==================================================
          # STEP 1
          # WAKE RENDER FREE SERVICE
          #
          # Render Free can spin down after inactivity.
          # Cold start can take much longer than 25 seconds.
          # ==================================================

          echo "========================================"
          echo "WAKING KALXA RENDER SERVICE"
          echo "========================================"

          WAKE_RESPONSE_FILE="$(mktemp)"

          set +e

          WAKE_HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --output "$WAKE_RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "${BASE_URL}/")

          WAKE_CURL_EXIT=$?

          set -e

          echo ""
          echo "Wake curl exit code: ${WAKE_CURL_EXIT}"
          echo "Wake HTTP status: ${WAKE_HTTP_STATUS:-none}"
          echo ""

          rm -f "$WAKE_RESPONSE_FILE"

          if [ "$WAKE_CURL_EXIT" -ne 0 ]; then
            echo "Kalxa could not be awakened."
            exit 1
          fi

          if [ -z "${WAKE_HTTP_STATUS}" ]; then
            echo "Kalxa returned no HTTP status during wake-up."
            exit 1
          fi

          if [ "$WAKE_HTTP_STATUS" -lt 200 ] || [ "$WAKE_HTTP_STATUS" -ge 500 ]; then
            echo "Kalxa wake-up returned unexpected HTTP status ${WAKE_HTTP_STATUS}."
            exit 1
          fi

          echo "Kalxa service is awake."
          echo ""

          # Small pause so Gunicorn is fully ready.
          sleep 3


          # ==================================================
          # STEP 2
          # IMPORT EACH RSS FEED SEPARATELY
          #
          # Render:
          #
          # feed 0 = iYouth Internships
          # feed 1 = iYouth Learnerships
          #
          # Each feed gets its own Flask request.
          # ==================================================

          for FEED_INDEX in 0 1
          do

            echo ""
            echo "========================================"
            echo "IMPORTING FEED INDEX ${FEED_INDEX}"
            echo "========================================"

            TARGET_URL="${BASE_URL}/internal/jobs/import/rss?feed_index=${FEED_INDEX}"

            echo "Target: ${TARGET_URL}"
            echo ""

            RESPONSE_FILE="$(mktemp)"

            set +e

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --location \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${KALXA_RSS_IMPORT_TOKEN}" \
              --header "Accept: application/json" \
              --header "User-Agent: Kalxa-GitHub-Actions-RSS-Importer/1.0" \
              --connect-timeout 10 \
              --max-time 28 \
              "${TARGET_URL}")

            CURL_EXIT=$?

            set -e

            echo "Curl exit code: ${CURL_EXIT}"
            echo "HTTP status: ${HTTP_STATUS:-none}"
            echo ""

            echo "Response:"

            if [ -s "$RESPONSE_FILE" ]; then
              cat "$RESPONSE_FILE"
            else
              echo "(no response body)"
            fi

            echo ""
            echo ""

            # ================================================
            # CURL FAILURE
            # ================================================

            if [ "$CURL_EXIT" -ne 0 ]; then

              echo "Kalxa RSS request failed for feed index ${FEED_INDEX}."

              rm -f "$RESPONSE_FILE"

              exit 1

            fi


            # ================================================
            # HTTP FAILURE
            # ================================================

            if [ -z "${HTTP_STATUS}" ]; then

              echo "No HTTP status returned for feed index ${FEED_INDEX}."

              rm -f "$RESPONSE_FILE"

              exit 1

            fi


            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then

              echo "Kalxa RSS import failed for feed index ${FEED_INDEX}."

              rm -f "$RESPONSE_FILE"

              exit 1

            fi


            # ================================================
            # API FAILURE
            # ================================================

            if grep -q '"success":false' "$RESPONSE_FILE"; then

              echo "Kalxa importer returned success=false for feed index ${FEED_INDEX}."

              rm -f "$RESPONSE_FILE"

              exit 1

            fi


            echo "Feed index ${FEED_INDEX} completed successfully."

            rm -f "$RESPONSE_FILE"


            # Small pause between feeds.
            sleep 2

          done


          # ==================================================
          # COMPLETE
          # ==================================================

          echo ""
          echo "========================================"
          echo "KALXA RSS JOBS IMPORT COMPLETE"
          echo "========================================"
          echo "All configured feeds completed successfully."

