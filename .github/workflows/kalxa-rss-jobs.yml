
name: Kalxa RSS Jobs Import

on:
  workflow_dispatch:

  schedule:
    # Every 6 hours at minute 17.
    # GitHub supports timezone-aware schedules.
    - cron: "17 */6 * * *"
      timezone: "Africa/Johannesburg"

jobs:
  import-rss-jobs:
    name: Import RSS Jobs
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Trigger Kalxa RSS importer
        env:
          KALXA_RSS_IMPORT_TOKEN: ${{ secrets.KALXA_RSS_IMPORT_TOKEN }}
          KALXA_BASE_URL: ${{ vars.KALXA_BASE_URL }}

        run: |
          set -euo pipefail

          BASE_URL="${KALXA_BASE_URL:-https://lac-local-access.onrender.com}"
          BASE_URL="${BASE_URL%/}"

          echo "========================================"
          echo "KALXA RSS JOBS IMPORT"
          echo "========================================"
          echo "Base URL: ${BASE_URL}"
          echo ""

          # ==================================================
          # IMPORT EACH CONFIGURED FEED SEPARATELY
          #
          # Current Render configuration:
          #
          # 0 = iYouth Internships
          # 1 = iYouth Learnerships
          #
          # Each feed gets its own HTTP request so Render Free
          # does not spend too long processing multiple feeds
          # inside one Flask request.
          # ==================================================

          for FEED_INDEX in 0 1
          do

            echo ""
            echo "========================================"
            echo "IMPORTING FEED INDEX ${FEED_INDEX}"
            echo "========================================"

            TARGET_URL="${BASE_URL}/internal/jobs/import/rss?feed_index=${FEED_INDEX}"

            echo "Target: ${TARGET_URL}"
            echo ""

            RESPONSE_FILE="$(mktemp)"

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --location \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${KALXA_RSS_IMPORT_TOKEN}" \
              --header "Accept: application/json" \
              --header "User-Agent: Kalxa-GitHub-Actions-RSS-Importer/1.0" \
              --max-time 25 \
              "${TARGET_URL}")

            echo "HTTP status: ${HTTP_STATUS}"
            echo ""

            echo "Response:"
            cat "$RESPONSE_FILE"
            echo ""

            # ================================================
            # FAIL WORKFLOW ON HTTP ERROR
            # ================================================

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then

              echo ""
              echo "Kalxa RSS import failed for feed index ${FEED_INDEX}."

              rm -f "$RESPONSE_FILE"

              exit 1

            fi

            # ================================================
            # ALSO FAIL IF API RETURNS success=false
            # ================================================

            if grep -q '"success":false' "$RESPONSE_FILE"; then

              echo ""
              echo "Kalxa RSS importer returned success=false for feed index ${FEED_INDEX}."

              rm -f "$RESPONSE_FILE"

              exit 1

            fi

            echo ""
            echo "Feed index ${FEED_INDEX} completed successfully."

            rm -f "$RESPONSE_FILE"

          done

          echo ""
          echo "========================================"
          echo "KALXA RSS JOBS IMPORT COMPLETE"
          echo "========================================"
          echo "All configured feeds completed successfully."

