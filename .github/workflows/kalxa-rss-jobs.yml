
name: Kalxa RSS Jobs Import

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"
      timezone: "Africa/Johannesburg"

jobs:
  import-rss-jobs:
    name: Import RSS Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Import RSS jobs
        env:
          KALXA_RSS_IMPORT_TOKEN: ${{ secrets.KALXA_RSS_IMPORT_TOKEN }}
          KALXA_BASE_URL: ${{ vars.KALXA_BASE_URL }}

        run: |
          set -euo pipefail

          BASE_URL="${KALXA_BASE_URL:-https://lac-local-access.onrender.com}"
          BASE_URL="${BASE_URL%/}"

          echo "========================================"
          echo "KALXA RSS JOBS IMPORT"
          echo "========================================"

          # ==================================================
          # ROTATION
          # ==================================================

          CURRENT_EPOCH=$(date +%s)

          ROTATION_BATCH=$(( CURRENT_EPOCH / 21600 ))

          echo "Current epoch: ${CURRENT_EPOCH}"
          echo "Rotation batch: ${ROTATION_BATCH}"
          echo ""


          # ==================================================
          # WAKE RENDER
          # ==================================================

          echo "Waking Kalxa..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            "${BASE_URL}/"

          echo "Kalxa is awake."
          echo ""

          sleep 2


          # ==================================================
          # CONFIGURED FEEDS
          # ==================================================

          FEEDS=(
            "0|https://iyouth.co.za/rss/category/internships"
            "1|https://iyouth.co.za/rss/category/learnerships"
          )


          # ==================================================
          # IMPORT EACH FEED
          # ==================================================

          for FEED in "${FEEDS[@]}"
          do

            FEED_INDEX="${FEED%%|*}"
            FEED_URL="${FEED#*|}"

            echo ""
            echo "========================================"
            echo "FEED INDEX ${FEED_INDEX}"
            echo "========================================"
            echo "Source: ${FEED_URL}"
            echo "Rotation batch: ${ROTATION_BATCH}"
            echo ""

            RSS_FILE="$(mktemp)"
            RESPONSE_FILE="$(mktemp)"


            # ================================================
            # DOWNLOAD EXTERNAL RSS
            # ================================================

            echo "Downloading RSS..."

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 60 \
              --retry 2 \
              --retry-delay 3 \
              --retry-all-errors \
              --header "Accept: application/rss+xml, application/atom+xml, application/xml, text/xml, */*" \
              --header "User-Agent: Kalxa-GitHub-RSS-Fetcher/3.0" \
              --output "$RSS_FILE" \
              "$FEED_URL"


            RSS_SIZE=$(wc -c < "$RSS_FILE")

            echo "Downloaded ${RSS_SIZE} bytes."


            if [ "$RSS_SIZE" -lt 20 ]; then

              echo "Feed response is unexpectedly small."

              cat "$RSS_FILE"

              rm -f "$RSS_FILE" "$RESPONSE_FILE"

              exit 1

            fi


            # ================================================
            # SEND RSS TO KALXA
            # ================================================

            TARGET_URL="${BASE_URL}/internal/jobs/import/rss-payload?feed_index=${FEED_INDEX}&batch=${ROTATION_BATCH}"

            echo ""
            echo "Sending RSS to Kalxa..."
            echo "Target: ${TARGET_URL}"


            set +e

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --location \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${KALXA_RSS_IMPORT_TOKEN}" \
              --header "Content-Type: application/xml" \
              --header "Accept: application/json" \
              --header "User-Agent: Kalxa-GitHub-Actions-RSS-Importer/4.0" \
              --connect-timeout 10 \
              --max-time 25 \
              --data-binary "@${RSS_FILE}" \
              "${TARGET_URL}")

            CURL_EXIT=$?

            set -e


            echo ""
            echo "Curl exit code: ${CURL_EXIT}"
            echo "HTTP status: ${HTTP_STATUS:-none}"
            echo ""

            echo "Response:"

            if [ -s "$RESPONSE_FILE" ]; then
              cat "$RESPONSE_FILE"
            else
              echo "(no response body)"
            fi

            echo ""


            # ================================================
            # VALIDATE
            # ================================================

            if [ "$CURL_EXIT" -ne 0 ]; then

              rm -f "$RSS_FILE" "$RESPONSE_FILE"

              echo "Kalxa request failed."

              exit 1

            fi


            if [ -z "${HTTP_STATUS}" ]; then

              rm -f "$RSS_FILE" "$RESPONSE_FILE"

              echo "No HTTP status returned."

              exit 1

            fi


            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then

              rm -f "$RSS_FILE" "$RESPONSE_FILE"

              echo "Kalxa returned an HTTP error."

              exit 1

            fi


            if grep -q '"success":false' "$RESPONSE_FILE"; then

              rm -f "$RSS_FILE" "$RESPONSE_FILE"

              echo "Kalxa importer returned success=false."

              exit 1

            fi


            echo ""
            echo "Feed ${FEED_INDEX} completed successfully."


            rm -f "$RSS_FILE" "$RESPONSE_FILE"

            sleep 1

          done


          echo ""
          echo "========================================"
          echo "KALXA RSS JOBS IMPORT COMPLETE"
          echo "========================================"
