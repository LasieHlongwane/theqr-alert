name: Kalxa Reminder Scheduler

on:

  # =====================================================
  # AUTOMATIC SCHEDULE
  #
  # GitHub Actions' shortest cron interval is 5 minutes.
  # This checks Kalxa for due reminders every 5 minutes.
  # =====================================================

  schedule:
    - cron: "*/5 * * * *"


  # =====================================================
  # MANUAL TEST BUTTON
  #
  # Allows:
  #
  # GitHub
  # → Actions
  # → Kalxa Reminder Scheduler
  # → Run workflow
  #
  # =====================================================

  workflow_dispatch:


jobs:

  send-due-reminders:

    name: Send Due Kalxa Reminders

    runs-on: ubuntu-latest


    steps:

      # =================================================
      # CALL KALXA REMINDER ENDPOINT
      # =================================================

      - name: Run Kalxa reminder scheduler

        shell: bash

        env:

          REMINDER_CRON_TOKEN:
            ${{ secrets.REMINDER_CRON_TOKEN }}


        run: |

          echo "=========================================="
          echo "Kalxa Reminder Scheduler"
          echo "=========================================="

          echo "Calling Kalxa reminder service..."


          RESPONSE_FILE="$(mktemp)"


          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              "https://lac-local-access.onrender.com/internal/run-content-reminders" \
              --header "Authorization: Bearer ${REMINDER_CRON_TOKEN}" \
              --header "Accept: application/json" \
              --max-time 120
          )"


          echo ""
          echo "HTTP status: ${HTTP_STATUS}"

          echo ""
          echo "Kalxa response:"

          cat "$RESPONSE_FILE"

          echo ""


          # =============================================
          # FAIL WORKFLOW FOR NON-2XX RESPONSE
          # =============================================

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then

              echo ""
              echo "Kalxa reminder scheduler request failed."

              rm -f "$RESPONSE_FILE"

              exit 1

          fi


          echo ""
          echo "Kalxa reminder scheduler completed successfully."


          rm -f "$RESPONSE_FILE"
