<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% if category %}
            Edit Category
        {% else %}
            Add Category
        {% endif %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body class="lac-admin-body">

<div class="admin-shell">

    <nav class="admin-nav">

        <strong>
            LAC NETWORK
        </strong>

        <div class="admin-nav-links">

            <a href="{{ url_for(
                'admin.categories'
            ) }}">
                ← Categories
            </a>

        </div>

    </nav>


    <section class="admin-form-container">

        <p class="admin-eyebrow">
            CATEGORY MANAGEMENT
        </p>

        <h1>

            {% if category %}
                Edit Category
            {% else %}
                Add Category
            {% endif %}

        </h1>


        <form
            method="POST"
            enctype="multipart/form-data"
            class="admin-form"
        >

            <!-- ============================================= -->
            <!-- CATEGORY NAME -->
            <!-- ============================================= -->

            <label>

                Category Name

                <input
                    type="text"
                    name="name"
                    required
                    placeholder="Property"
                    value="{{
                        category.name
                        if category
                        else ''
                    }}"
                >

            </label>


            <!-- ============================================= -->
            <!-- SLUG -->
            <!-- ============================================= -->

            <label>

                Slug

                <input
                    type="text"
                    name="slug"
                    required
                    placeholder="property"
                    value="{{
                        category.slug
                        if category
                        else ''
                    }}"
                >

            </label>


            <!-- ============================================= -->
            <!-- ICON -->
            <!-- ============================================= -->

            <label>

                Icon

                <input
                    type="text"
                    name="icon"
                    placeholder="🏠"
                    value="{{
                        category.icon
                        if category and category.icon
                        else ''
                    }}"
                >

                <small>
                    Used as a fallback when no category image
                    has been uploaded.
                </small>

            </label>


            <!-- ============================================= -->
            <!-- CATEGORY IMAGE -->
            <!-- ============================================= -->

            <label>

                Category Image

                <input
                    type="file"
                    name="category_image"
                    id="category-image-input"
                    accept="image/jpeg,image/png,image/webp"
                >

                <small>
                    Recommended: landscape JPG, PNG or WebP.
                    The image will appear on the public
                    category card.
                </small>

            </label>


            <!-- ============================================= -->
            <!-- CURRENT / NEW IMAGE PREVIEW -->
            <!-- ============================================= -->

            <div
                id="category-image-preview-container"
                style="
                    {% if not category or not category.image_url %}
                        display: none;
                    {% endif %}
                    margin-top: 6px;
                    margin-bottom: 18px;
                "
            >

                <p
                    style="
                        margin-bottom: 8px;
                        font-size: 13px;
                        opacity: 0.75;
                    "
                >
                    Image Preview
                </p>

                <img
                    id="category-image-preview"
                    src="{{
                        category.image_url
                        if category and category.image_url
                        else ''
                    }}"
                    alt="Category image preview"
                    style="
                        display: block;
                        width: 100%;
                        max-width: 420px;
                        height: 190px;
                        object-fit: cover;
                        border-radius: 14px;
                    "
                >

            </div>


            <!-- ============================================= -->
            <!-- DISPLAY ORDER -->
            <!-- ============================================= -->

            <label>

                Display Order

                <input
                    type="number"
                    name="display_order"
                    value="{{
                        category.display_order
                        if category
                        else 0
                    }}"
                >

            </label>


            <!-- ============================================= -->
            <!-- ACTIVE -->
            <!-- ============================================= -->

            <label class="checkbox-label">

                <input
                    type="checkbox"
                    name="active"
                    {% if not category
                        or category.active %}
                        checked
                    {% endif %}
                >

                Active

            </label>


            <!-- ============================================= -->
            <!-- SUBMIT -->
            <!-- ============================================= -->

            <button type="submit">

                {% if category %}
                    Save Changes
                {% else %}
                    Create Category
                {% endif %}

            </button>

        </form>

    </section>

</div>


<!-- ======================================================== -->
<!-- LOCAL IMAGE PREVIEW -->
<!-- ======================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const imageInput =
            document.getElementById(
                "category-image-input"
            );

        const previewContainer =
            document.getElementById(
                "category-image-preview-container"
            );

        const preview =
            document.getElementById(
                "category-image-preview"
            );


        if (!imageInput) {
            return;
        }


        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    imageInput.files &&
                    imageInput.files[0];


                if (!file) {
                    return;
                }


                if (
                    !file.type.startsWith("image/")
                ) {
                    return;
                }


                const objectUrl =
                    URL.createObjectURL(file);


                preview.src = objectUrl;

                previewContainer.style.display =
                    "block";


                preview.onload = function () {

                    URL.revokeObjectURL(
                        objectUrl
                    );

                };

            }
        );

    }
);

</script>

</body>

</html>
