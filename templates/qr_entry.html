<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LaC | Local Access
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="qr-entry-body">


    <main class="qr-entry-page">

        <section class="qr-entry-card">

            <div class="qr-entry-logo">
                LaC
            </div>


            <h1>
                ACCESS.
                <br>
                DELIVERED.
            </h1>


            <p>
                Access local content by
                scanning a LaC QR code.
            </p>


            <div class="qr-entry-flow">

                <div>
                    <span>01</span>
                    <strong>Scan</strong>
                </div>

                <div class="qr-entry-arrow">
                    ↓
                </div>

                <div>
                    <span>02</span>
                    <strong>Discover</strong>
                </div>

                <div class="qr-entry-arrow">
                    ↓
                </div>

                <div>
                    <span>03</span>
                    <strong>Connect</strong>
                </div>

            </div>


            <small>
                QR ACCESS POINTS
                · LOCAL CONTENT
                · LOCAL CONNECTIONS
            </small>

        </section>

    </main>


</body>

</html>
